name: Build/ release IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-${{ runner.arch }}-pods-${{ hashFiles('bun.lock', 'apps/mobile/app.config.ts') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pods-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build unsigned IPA
        working-directory: apps/mobile
        run: ./scripts/build-unsigned-ipa.sh

      - name: Upload GH artifact
        uses: actions/upload-artifact@v7
        with:
          path: apps/mobile/build/Acorn-unsigned.ipa
