name: Build/ release IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/package.json') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build unsigned IPA
        working-directory: apps/mobile
        run: ./scripts/build-unsigned-ipa.sh

      - name: Create GH release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/build/Acorn-unsigned.ipa
          name: Built IPA
          body: |
            This IPA is **unsigned** — sideload it with Sideloadly, AltStore or SideStore,
            or re-sign it yourself before installing.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
